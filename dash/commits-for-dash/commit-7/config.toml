# ~/.config/dash/config.toml
# Optional CSS overrides: ~/.config/dash/style.css

[[panel]]
position = "top"
size = 36
spacing = 4
monitors = ["*"]
widgets = ["app_list", "custom_cmd", "date", "clock"]

[widget.app_list]
items = [
  { desktop = "brave-browser.desktop" },
  { label = "Terminal", icon = "utilities-terminal", command = "alacritty" },
]

[widget.custom_cmd]
type = "command"
icon = "⚡"
command = "uname -r"
on_click = "notify-send 'Kernel Version' 'System is running smoothly'"

[widget.clock]
format = "%H:%M"

[widget.date]
format = "%a %e %b"
