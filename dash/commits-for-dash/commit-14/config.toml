# ~/.config/dash/config.toml
# Optional CSS overrides: ~/.config/dash/style.css

[[panel]]
position = "top"
size = 36
spacing = 4
monitors = ["*"]
widgets = ["app_list", "workspaces", "notifications", "copyq", "volume", "wifi", "caps_lock", "date", "clock", "power"]

[widget.app_list]
items = [
  { desktop = "brave-browser.desktop" },
  { label = "Terminal", icon = "utilities-terminal", command = "alacritty" },
]

[widget.clock]
format = "%H:%M"

[widget.date]
format = "%a %e %b"

[widget.notifications]
stream = "swaync-client -swb"
on_click = "swaync-client -t -sw"

[widget.power]
items = [
  { label = "Lock",      command = "swaylock" },
  { label = "Suspend",   command = "systemctl suspend" },
  { label = "Reboot",    command = "systemctl reboot" },
  { label = "Power off", command = "systemctl poweroff" },
  { label = "Log out",   command = "loginctl terminate-session $XDG_SESSION_ID" },
]