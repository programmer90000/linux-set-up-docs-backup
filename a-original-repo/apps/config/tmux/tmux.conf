# Set the Ctrl+B prefix key explicitly
unbind C-b
set -g prefix C-b
bind C-b send-prefix # Send the Ctrl+B prefix to apps when clicked twice

# Set 256 colour support
set -g default-terminal "screen-256color"

# Explicitly set the base index and pane base index to 0
set -g base-index 0
setw -g pane-base-index 0

# Set history limit to 20000
set -g history-limit 20000

# Set the amount of time status messages are displayed
set-option -g display-time 3000
set-option -g display-panes-time 3000

# No delay for escape key press
set -sg escape-time 0

# Automatically set window title to running program (can be overriden by manually setting the name)
set-window-option -g automatic-rename on
set-option -g set-titles on

# Change background color of a tab when activity occurs
setw -g monitor-activity on

# Do not reset the color of the tab after activity stops occuring
setw -g monitor-silence 0

# Disable bell
setw -g monitor-bell off

# Enable visual flash when activity occurs
set -g visual-activity on

# Allow the arrow key to be used immediately after changing windows.
set-option -g repeat-time 0

# Key bindings for copy-paste
unbind p
bind p paste-buffer
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Theme
set-window-option -g window-status-current-style bold,bg=colour238,fg=colour231
set-window-option -g window-status-style fg=colour236
set -g window-status-activity-style bold,bg=colour234,fg=white
set-option -g message-style bg=colour237,fg=colour231
set-option -g pane-border-style fg=colour36
set-option -g pane-active-border-style fg=colour35

# Status bar
set -g status-bg colour184
set -g status-fg white
set -g status-justify left
set -g status-left ""
set -g status-right ""
set -g window-status-format "#I:#W"
set -g window-status-current-format "#I:#W"
set -g window-status-separator " "
run-shell 'tmux set-option -g status-right "#[fg=colour236]#S • $USER@$(hostname -s)"'

# Tmux Resurrect
run-shell ~/.config/tmux/tmux-resurrect/resurrect.tmux
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-pane-contents-area 'full'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-dir '~/.config/tmux/tmux-resurrect/'
bind C-s run-shell ~/.config/tmux/tmux-resurrect/scripts/save.sh
bind C-r run-shell ~/.config/tmux/tmux-resurrect/scripts/restore.sh
set -g @resurrect-strategy-pane-contents 'always'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-save-zoomed-window 'on'
set -g @resurrect-process-expansion 'on'
set -g @resurrect-delete-backup-after '0'
set -g @resurrect-never-overwrite 'on'
set -g @resurrect-save-command-strategy 'ps'
set -g @resurrect-default-processes 'vi vim nvim emacs man less more tail top htop irssi weechat mutt'

# Tmux Choose Tree
bind Tab choose-tree
bind C-t choose-tree -w
bind C-d choose-tree -s
set -g @choose-tree-expand 'on'
set -g @choose-tree-show-session-names 'on'

# Zoom
unbind-key z
bind-key z resize-pane -Z

# Tmux Better Mouse Mode
set -g mouse on
set -g @scroll-down-exit-copy-mode "off"
set -g @scroll-without-changing-pane "on"
set -g @scroll-in-moused-over-pane "off"
set -g @scroll-speed-num-lines-per-scroll "1"
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"
run-shell ~/.config/tmux/tmux-better-mouse-mode/scroll_copy_mode.tmux

# Clipboard
set -g set-clipboard on
