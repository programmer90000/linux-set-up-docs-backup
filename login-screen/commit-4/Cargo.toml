[package]
name = "wayfire-greetd-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
glib = "0.9"
gtk4-layer-shell = "0.4"
greetd_ipc = { version = "0.10", features = ["sync-codec"] }
chrono = "0.4"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true